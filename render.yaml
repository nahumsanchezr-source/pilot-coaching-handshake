services:
  # Backend API Web Service
  - type: web
    name: skyops-backend-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: "sqlite:///./coaching.db"

  # Frontend Static Site (Global CDN, no region or plan needed)
  - type: web
    name: skyops-frontend-ui
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: skyops-backend-api
          property: url
